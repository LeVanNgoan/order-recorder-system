name: Build Android Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/shopeefood-agent/**"
      - "shared/contracts/**"
      - ".github/workflows/build-spf.yml"
  pull_request:
    paths:
      - "apps/shopeefood-agent/**"
      - "shared/contracts/**"
      - ".github/workflows/build-spf.yml"

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shopeefood-agent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify stable source invariants
        run: python verify_source_v2.0.10.py
      - name: Build unsigned/public debug artifact
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: shopeefood-order-recorder-final-v2.0.10-public-debug
          path: apps/shopeefood-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
