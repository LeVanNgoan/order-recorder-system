name: Package GrabFood Extension
on:
  workflow_dispatch:
  push:
    paths: ["apps/grabfood-extension/**", "shared/contracts/**", ".github/workflows/package-grab.yml"]
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check apps/grabfood-extension/service-worker.js
      - run: node --check apps/grabfood-extension/src/controller/service-worker-controller.js
      - run: node --check apps/grabfood-extension/src/controller/grab-monitor.js
      - run: cd apps/grabfood-extension && zip -qr ../../GrabOrderRecorder-v2.0.1-MVC2.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: GrabOrderRecorder-v2.0.1-MVC2
          path: GrabOrderRecorder-v2.0.1-MVC2.zip
