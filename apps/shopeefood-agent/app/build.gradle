plugins { id 'com.android.application' }

// Public-repository signing policy:
// - debug builds use Android's standard debug signing;
// - release signing is enabled only when credentials are supplied externally;
// - no keystore or password is committed to Git.
def releaseStoreFile = providers.gradleProperty('ORDERRECORDER_STORE_FILE').orNull ?: System.getenv('ORDERRECORDER_STORE_FILE')
def releaseStorePassword = providers.gradleProperty('ORDERRECORDER_STORE_PASSWORD').orNull ?: System.getenv('ORDERRECORDER_STORE_PASSWORD')
def releaseKeyAlias = providers.gradleProperty('ORDERRECORDER_KEY_ALIAS').orNull ?: System.getenv('ORDERRECORDER_KEY_ALIAS')
def releaseKeyPassword = providers.gradleProperty('ORDERRECORDER_KEY_PASSWORD').orNull ?: System.getenv('ORDERRECORDER_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.toString().isBlank() }

android {
    namespace 'vn.orderrecorder.shopee'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.orderrecorder.shopee'
        minSdk 24
        targetSdk 35
        versionCode 30
        versionName '2.0.10'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Uses the standard Android debug key generated by the local/CI environment.
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
